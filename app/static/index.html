        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
        logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
        sparkles: '<path d="M9.94 14.06 8 20l-1.94-5.94L0 12l6.06-1.94L8 4l1.94 6.06L16 12z" transform="translate(2 -1) scale(.95)"/><path d="M20 3v4M22 5h-4M18 17v3M19.5 18.5h-3"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
        calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
        layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
        bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
        smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
    };

    const MAX_UPLOAD_MB = 20;
    const ALLOWED = ['pdf', 'docx', 'txt', 'md'];
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
    };

    // --- Markdown: marked + highlight.js, sanitised with DOMPurify ---
    const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let highlightCode = true;
    marked.use({
        gfm: true,
        breaks: true,
        renderer: {
            code({ text, lang }) {
                const language = (lang || '').trim().split(/\s+/)[0];
                let html = escapeHtml(text);
                if (highlightCode && window.hljs) {
                    try {
                        html = language && hljs.getLanguage(language)
                            ? hljs.highlight(text, { language }).value
                            : hljs.highlightAuto(text).value;
                    } catch (e) {}
                }
                return `<div class="code-block"><div class="code-head"><span>${escapeHtml(language || 'code')}</span>` +
                       `<button type="button" class="code-copy" data-copy-code>Copy</button></div>` +
                       `<pre><code class="hljs">${html}</code></pre></div>`;
            },
        },
    });
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
        if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
    });

    let uid = 0;
    const nextId = () => `m${Date.now().toString(36)}${(uid++).toString(36)}`;

    const app = Vue.createApp({
        template: '#app-tpl',
        data() {
            return {
                booting: true,
                user: null,
                avatarFailed: false,
                theme: document.documentElement.dataset.theme || 'dark',
                sidebarCollapsed: store.get('chatdocs-sidebar') === 'collapsed',
                drawerOpen: false,
                tab: 'chats',
                menuOpen: false,

                threads: [],
                threadsLoading: true,
                activeThreadId: null,
                threadLoading: false,
                messages: [],

                documents: [],
                docsLoading: true,
                uploads: [],
                uploadRunning: false,
                pollTimer: null,
                zoneOver: false,
                dragActive: false,
                dragDepth: 0,

                input: '',
                composerFocused: false,
                streaming: false,
                abortCtrl: null,
                atBottom: true,
                copiedId: null,

                toasts: [],
                confirmState: null,
                maxUploadMb: MAX_UPLOAD_MB,
                modKey: /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl',
            };
        },
        computed: {
            firstName() { return (this.user && this.user.name || '').split(' ')[0]; },
            initial() { return (this.firstName || this.user?.email || 'U').charAt(0).toUpperCase(); },
            greeting() {
                const h = new Date().getHours();
                return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
            },
            activeTitle() {
                if (!this.activeThreadId) return 'New chat';
                const t = this.threads.find((t) => t.id === this.activeThreadId);
                return t ? t.title : 'Conversation';
            },
            readyDocs() { return this.documents.filter((d) => d.status === 'ready'); },
            processingCount() { return this.documents.filter((d) => d.status === 'processing').length; },
            chipLabel() {
                if (this.processingCount) return `Indexing ${this.processingCount}…`;
                const n = this.readyDocs.length;
                return n ? `${n} doc${n === 1 ? '' : 's'}` : 'No docs';
            },
            placeholder() {
                return this.readyDocs.length ? 'Ask anything about your documents…' : 'Say hi, or add a document to get started…';
            },
            suggestions() {
                const docs = this.readyDocs;
                if (!docs.length) {
                    return [
                        { icon: 'upload', title: 'Upload your first document', sub: 'PDF, Word, text or Markdown', action: () => this.pickFiles() },
                        { icon: 'smile', title: 'What can you help me with?', sub: 'See what ChatDocs can do', prompt: 'Hello! What can you help me with?' },
                        { icon: 'bulb', title: 'How does this work?', sub: 'Learn how answers are sourced', prompt: 'How do you find answers in my documents, and how should I phrase questions to get the best results?' },
                        { icon: 'list', title: 'What files can I add?', sub: 'Formats and tips', prompt: 'What kinds of documents can I upload, and what are they good for?' },
                    ];
                }
                const first = docs[0].filename;
                const items = [
                    { icon: 'sparkles', title: `Summarise ${first}`, sub: 'Key points in a few bullets', prompt: `Give me a concise summary of ${first}, with the key points as bullets.` },
                    { icon: 'bulb', title: 'Key takeaways', sub: docs.length > 1 ? 'Across all your documents' : 'The most important insights', prompt: docs.length > 1 ? 'What are the most important takeaways across all my documents?' : `What are the most important takeaways from ${first}?` },
                    { icon: 'calendar', title: 'Find dates & deadlines', sub: 'Pull out anything time-sensitive', prompt: 'List every date, deadline or time-sensitive item mentioned in my documents, with its source.' },
                ];
                items.push(docs.length > 1
                    ? { icon: 'layers', title: `Compare ${docs[0].filename} and ${docs[1].filename}`, sub: 'Similarities and differences', prompt: `Compare ${docs[0].filename} and ${docs[1].filename}. What do they agree on, and where do they differ? Use a table if it helps.` }
                    : { icon: 'smile', title: 'What can you help me with?', sub: 'See what ChatDocs can do', prompt: 'Hello! What can you help me with?' });
                return items;
            },
            groupedThreads() {
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
                const buckets = [
                    { label: 'Today', min: startOfDay, items: [] },
                    { label: 'Yesterday', min: startOfDay - 86400, items: [] },
                    { label: 'Previous 7 days', min: startOfDay - 7 * 86400, items: [] },
                    { label: 'Previous 30 days', min: startOfDay - 30 * 86400, items: [] },
                    { label: 'Older', min: -Infinity, items: [] },
                ];
                for (const t of this.threads) {
                    const ts = t.updated_at || 0;
                    buckets.find((b) => ts >= b.min).items.push(t);
                }
                return buckets.filter((b) => b.items.length);
            },
        },
        watch: {
            sidebarCollapsed(v) { store.set('chatdocs-sidebar', v ? 'collapsed' : null); },
        },
        async mounted() {
            window.addEventListener('keydown', this.onGlobalKey);
            window.addEventListener('click', () => { this.menuOpen = false; });
            window.addEventListener('dragenter', this.onWindowDragEnter);
            window.addEventListener('dragleave', this.onWindowDragLeave);
            window.addEventListener('dragover', (e) => { if (this.hasFiles(e)) e.preventDefault(); });
            window.addEventListener('drop', (e) => { if (this.hasFiles(e)) { e.preventDefault(); this.dragActive = false; this.dragDepth = 0; } });

            await this.checkAuth();
            this.booting = false;
            if (!this.user) return;

            const lastThread = store.get('chatdocs-thread');
            await Promise.all([this.fetchDocuments(), this.fetchThreads()]);
            if (lastThread && this.threads.some((t) => t.id === lastThread)) this.openThread(lastThread);
            this.$nextTick(() => this.focusInput());
        },
        methods: {
            // ---------- API ----------
            async api(path, opts = {}) {
                const res = await fetch(path, { credentials: 'same-origin', ...opts });
                if (res.status === 401) { this.sessionExpired(); throw new Error('unauthorized'); }
                return res;
            },
            sessionExpired() {
                if (!this.user) return;
                this.user = null;
                this.toast('Your session expired. Please sign in again.', 'info');
            },
            async checkAuth() {
                try {
                    const res = await fetch('/auth/me', { credentials: 'same-origin' });
                    if (res.ok) this.user = await res.json();
                } catch (e) { /* offline or not signed in */ }
            },
            logout() { window.location.href = '/auth/logout'; },

            // ---------- Threads ----------
            async fetchThreads() {
                try {
                    const res = await this.api('/threads');
                    if (res.ok) this.threads = (await res.json()).threads;
                } catch (e) { if (e.message !== 'unauthorized') this.toast('Could not load your conversations.', 'error'); }
                finally { this.threadsLoading = false; }
            },
            async openThread(id) {
                if (id === this.activeThreadId && this.messages.length) { this.drawerOpen = false; return; }
                this.stop();
                this.activeThreadId = id;
                store.set('chatdocs-thread', id);
                this.drawerOpen = false;
                this.threadLoading = true;
                this.messages = [];
                try {
                    const res = await this.api(`/threads/${encodeURIComponent(id)}`);
                    if (!res.ok) throw new Error('not found');
                    const data = await res.json();
                    if (this.activeThreadId !== id) return;
                    this.messages = data.messages.map((m) => ({ id: nextId(), sources: [], ...m, streaming: false }));
                } catch (e) {
                    if (e.message === 'unauthorized') return;
                    this.toast('That conversation could not be loaded.', 'error');
                    this.threads = this.threads.filter((t) => t.id !== id);
                    this.newChat();
                } finally {
                    this.threadLoading = false;
                    this.$nextTick(() => this.scrollToBottom(false));
                }
            },
            newChat() {
                this.stop();
                this.activeThreadId = null;
                this.messages = [];
                this.threadLoading = false;
                store.set('chatdocs-thread', null);
                this.drawerOpen = false;
                this.tab = 'chats';
                this.$nextTick(() => this.focusInput());
            },
            async deleteThread(t) {
                const ok = await this.confirm('Delete this conversation?', `"${t.title}" will be removed permanently.`, 'Delete');
                if (!ok) return;
                try {
                    const res = await this.api(`/threads/${encodeURIComponent(t.id)}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error();
                    this.threads = this.threads.filter((x) => x.id !== t.id);
                    if (this.activeThreadId === t.id) this.newChat();
                    this.toast('Conversation deleted.', 'success');
                } catch (e) { if (e.message !== 'unauthorized') this.toast('Could not delete the conversation.', 'error'); }
            },
            touchThread(id, title) {
                const now = Date.now() / 1000;
                const existing = this.threads.find((t) => t.id === id);
                const entry = existing || { id, title };
                entry.updated_at = now;
                this.threads = [entry, ...this.threads.filter((t) => t.id !== id)];
            },

            // ---------- Chat ----------
            async send(text, { retry = false } = {}) {
                const message = (text ?? this.input).trim();
                if (!message || this.streaming) return;
                if (text === undefined) { this.input = ''; this.$nextTick(this.autoGrow); }

                if (!retry) this.messages.push({ id: nextId(), role: 'user', content: message });
                this.messages.push({ id: nextId(), role: 'assistant', content: '', sources: [], streaming: true, status: 'Thinking', statusDetail: null, error: null, stopped: false });
                const msg = this.messages[this.messages.length - 1];
                this.streaming = true;
                this.atBottom = true;
                this.$nextTick(() => this.scrollToBottom(true));

                const ctrl = new AbortController();
                this.abortCtrl = ctrl;
                try {
                    const res = await this.api('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message, thread_id: this.activeThreadId }),
                        signal: ctrl.signal,
                    });
                    if (!res.ok || !res.body) throw new Error('bad response');

                    const threadId = res.headers.get('X-Thread-ID');
                    if (threadId) {
                        if (!this.activeThreadId) {
                            this.activeThreadId = threadId;
                            store.set('chatdocs-thread', threadId);
                        }
                        const title = message.replace(/\s+/g, ' ');
                        this.touchThread(threadId, title.length > 60 ? title.slice(0, 60) + '…' : title);
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        let nl;
                        while ((nl = buffer.indexOf('\n')) >= 0) {
                            const line = buffer.slice(0, nl).trim();
                            buffer = buffer.slice(nl + 1);
                            if (line) this.handleEvent(msg, JSON.parse(line));
                        }
                        this.stickToBottom();
                    }
                } catch (e) {
                    if (e.name === 'AbortError') msg.stopped = true;
                    else if (e.message !== 'unauthorized') msg.error = 'Could not reach the assistant. Check your connection and try again.';
                } finally {
                    msg.streaming = false;
                    msg.status = null;
                    this.streaming = false;
                    this.abortCtrl = null;
                    if (!msg.content && !msg.error && !msg.stopped) msg.error = 'The assistant returned an empty response.';
                    this.$nextTick(() => this.stickToBottom());
                }
            },
            handleEvent(msg, ev) {
                if (ev.type === 'delta') { msg.content += ev.text; msg.status = null; }
                else if (ev.type === 'status') { msg.status = ev.text; msg.statusDetail = ev.detail || null; }
                else if (ev.type === 'sources') { msg.sources = ev.items || []; }
                else if (ev.type === 'error') { msg.error = ev.text; }
            },
            stop() { if (this.abortCtrl) this.abortCtrl.abort(); },
            retry(index) {
                const prevUser = [...this.messages.slice(0, index)].reverse().find((m) => m.role === 'user');
                if (!prevUser || this.streaming) return;
                this.messages.splice(index, 1);
                this.send(prevUser.content, { retry: true });
            },
            askAbout(doc) {
                this.drawerOpen = false;
                this.send(`Give me a concise summary of ${doc.filename}, with the key points as bullets.`);
            },
            askFromSource(s) {
                this.input = `In ${s.name}${s.page ? ` (page ${s.page})` : ''}, `;
                this.$nextTick(() => { this.focusInput(); this.autoGrow(); });
            },
            async copy(text, id) {
                try {
                    await navigator.clipboard.writeText(text);
                    this.copiedId = id;
                    setTimeout(() => { if (this.copiedId === id) this.copiedId = null; }, 1600);
                } catch (e) { this.toast('Copy failed.', 'error'); }
            },
            onContentClick(e) {
                const btn = e.target.closest('[data-copy-code]');
                if (!btn) return;
                const code = btn.closest('.code-block').querySelector('code').innerText;
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = 'Copied';
                    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
                });
            },
            renderMarkdown(text, streaming) {
                highlightCode = !streaming;  // highlight once the answer is complete
                const html = marked.parse(text || '').replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
                // No images or forms: model output can't load remote URLs (a data-exfiltration route for prompt injection).
                return DOMPurify.sanitize(html, { FORBID_TAGS: ['img', 'style', 'form', 'input', 'svg', 'math'], FORBID_ATTR: ['style'] });
            },

            // ---------- Documents ----------
            async fetchDocuments({ quiet = false } = {}) {
                try {
                    const res = await this.api('/documents');
                    if (!res.ok) throw new Error();
                    const docs = (await res.json()).documents;
                    // Announce documents that finished indexing since the last refresh.
                    const before = new Map(this.documents.map((d) => [d.filename, d.status]));
                    for (const d of docs) {
                        if (before.get(d.filename) !== 'processing') continue;
                        if (d.status === 'ready') this.toast(`${d.filename} is ready. Ask away.`, 'success');
                        else if (d.status === 'failed') this.toast(`${d.filename} couldn't be indexed.`, 'error');
                    }
                    this.documents = docs;
                } catch (e) { if (e.message !== 'unauthorized' && !quiet) this.toast('Could not load your library.', 'error'); }
                finally { this.docsLoading = false; this.schedulePoll(); }
            },
            schedulePoll() {
                // Poll while anything is indexing; stop as soon as everything settles.
                clearTimeout(this.pollTimer);
                if (this.user && this.processingCount) {
                    this.pollTimer = setTimeout(() => this.fetchDocuments({ quiet: true }), 2000);
                }
            },
            async retryDocument(doc) {
                try {
                    const res = await this.api('/documents/retry', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: doc.filename }),
                    });
                    if (!res.ok) throw new Error();
                    doc.status = 'processing'; doc.error = null;
                    this.schedulePoll();
                } catch (e) { if (e.message !== 'unauthorized') this.toast('Could not retry this document.', 'error'); }
            },
            pickFiles() { this.$refs.filePicker.click(); },
            onPick(e) { this.addFiles(e.target.files); e.target.value = ''; },
            onDrop(e) {
                this.zoneOver = false; this.dragActive = false; this.dragDepth = 0;
                if (e.dataTransfer?.files?.length) this.addFiles(e.dataTransfer.files);
            },
            addFiles(fileList) {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                for (const file of files) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    const item = { id: nextId(), name: file.name, file, progress: 0, state: 'queued', error: null };
                    if (!ALLOWED.includes(ext)) { item.state = 'error'; item.error = 'Unsupported file type'; }
                    else if (file.size > MAX_UPLOAD_MB * 1024 * 1024) { item.state = 'error'; item.error = `Larger than ${MAX_UPLOAD_MB} MB`; }
                    this.uploads.push(item);
                }
                this.tab = 'library';
                if (window.innerWidth <= 900) this.drawerOpen = true;
                this.runUploads();
            },
            async runUploads() {
                if (this.uploadRunning) return;
                this.uploadRunning = true;
                let item;
                while ((item = this.uploads.find((u) => u.state === 'queued'))) {
                    await this.uploadOne(item);
                }
                this.uploadRunning = false;
            },
            uploadOne(item) {
                // XHR rather than fetch so we can show real upload progress.
                return new Promise((resolve) => {
                    const u = this.uploads.find((x) => x.id === item.id);
                    u.state = 'uploading';
                    const form = new FormData();
                    form.append('files', item.file);
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/upload');
                    xhr.upload.onprogress = (e) => { if (e.lengthComputable) u.progress = Math.round((e.loaded / e.total) * 100); };
                    xhr.upload.onload = () => { u.state = 'saving'; };
                    xhr.onload = async () => {
                        if (xhr.status === 401) { this.sessionExpired(); return resolve(); }
                        let body = {};
                        try { body = JSON.parse(xhr.responseText); } catch (e) {}
                        const result = (body.results || [])[0];
                        if (xhr.status < 300 && result && result.ok) {
                            // Saved; indexing continues server-side and shows on the library row.
                            const row = { filename: result.filename, size: item.file.size, uploaded_at: new Date().toISOString(), status: 'processing', error: null };
                            this.documents = [row, ...this.documents.filter((d) => d.filename !== row.filename)];
                            this.dismissUpload(u);
                            this.schedulePoll();
                        } else {
                            u.state = 'error';
                            u.error = (result && result.error) || 'Upload failed';
                        }
                        resolve();
                    };
                    xhr.onerror = () => { u.state = 'error'; u.error = 'Network error'; resolve(); };
                    xhr.send(form);
                });
            },
            dismissUpload(u) { this.uploads = this.uploads.filter((x) => x.id !== u.id); },
            uploadLabel(u) {
                return { queued: 'Waiting…', uploading: `Uploading · ${u.progress}%`, saving: 'Saving…', done: 'Ready', error: u.error }[u.state];
            },
            async deleteDocument(doc) {
                const ok = await this.confirm(`Delete ${doc.filename}?`, 'It will be removed from your library and ChatDocs will no longer use it to answer.', 'Delete');
                if (!ok) return;
                const before = this.documents;
                this.documents = this.documents.filter((d) => d.filename !== doc.filename);
                try {
                    const res = await this.api('/delete-document', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: doc.filename }),
                    });
                    if (!res.ok) throw new Error();
                    this.toast(`${doc.filename} deleted.`, 'success');
                } catch (e) {
                    this.documents = before;
                    if (e.message !== 'unauthorized') this.toast('Could not delete the document.', 'error');
                }
            },
            async clearLibrary() {
                const ok = await this.confirm('Clear your entire library?', `All ${this.documents.length} documents will be deleted permanently. Your conversations are kept.`, 'Clear library');
                if (!ok) return;
                try {
                    const res = await this.api('/clear-knowledge', { method: 'DELETE' });
                    if (!res.ok) throw new Error();
                    this.documents = [];
                    this.toast('Library cleared.', 'success');
                } catch (e) { if (e.message !== 'unauthorized') this.toast('Could not clear the library.', 'error'); }
            },
            openLibrary() {
                this.tab = 'library';
                if (window.innerWidth <= 900) this.drawerOpen = true;
                else this.sidebarCollapsed = false;
                if (!this.documents.length) this.pickFiles();
            },
            fileType(name) {
                const ext = (name || '').split('.').pop().toLowerCase();
                return { pdf: { cls: 'pdf', label: 'PDF' }, docx: { cls: 'docx', label: 'DOC' }, md: { cls: 'md', label: 'MD' }, txt: { cls: 'txt', label: 'TXT' } }[ext] || { cls: 'file', label: 'FILE' };
            },
            docSubtitle(d) {
                if (d.status === 'processing') return 'Reading & indexing…';
                if (d.status === 'failed') return d.error || 'Indexing failed';
                const parts = [];
                if (d.size) parts.push(this.formatSize(d.size));
                if (d.uploaded_at) parts.push(this.relativeTime(new Date(d.uploaded_at).getTime() / 1000));
                return parts.join(' · ') || 'Indexed';
            },
            formatSize(b) {
                if (b < 1024) return `${b} B`;
                if (b < 1024 * 1024) return `${Math.round(b / 1024)} KB`;
                return `${(b / 1024 / 1024).toFixed(1)} MB`;
            },
            relativeTime(ts) {
                const s = Date.now() / 1000 - ts;
                if (s < 60) return 'just now';
                if (s < 3600) return `${Math.floor(s / 60)}m ago`;
                if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
                if (s < 86400 * 7) return `${Math.floor(s / 86400)}d ago`;
                return new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            },

            // ---------- Drag & drop anywhere ----------
            hasFiles(e) { return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); },
            onWindowDragEnter(e) { if (!this.hasFiles(e) || !this.user) return; this.dragDepth++; this.dragActive = true; },
            onWindowDragLeave(e) { if (!this.hasFiles(e)) return; this.dragDepth = Math.max(0, this.dragDepth - 1); if (!this.dragDepth) this.dragActive = false; },

            // ---------- Composer & scrolling ----------
            focusInput() { if (window.innerWidth > 900) this.$refs.input?.focus(); },
            autoGrow() {
                const el = this.$refs.input;
                if (!el) return;
                el.style.height = 'auto';
                el.style.height = Math.min(el.scrollHeight, 220) + 'px';
            },
            onComposerKey(e) {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.send(); }
            },
            onGlobalKey(e) {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.newChat(); return; }
                if (e.key === 'Escape') {
                    if (this.confirmState) this.resolveConfirm(false);
                    else if (this.menuOpen) this.menuOpen = false;
                    else if (this.drawerOpen) this.drawerOpen = false;
                    else if (this.streaming) this.stop();
                    return;
                }
                const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
                if (e.key === '/' && !typing && this.user) { e.preventDefault(); this.$refs.input?.focus(); }
            },
            onScroll() {
                const el = this.$refs.scroller;
                this.atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
            },
            stickToBottom() { if (this.atBottom) this.scrollToBottom(false); },
            scrollToBottom(smooth) {
                this.$nextTick(() => {
                    const el = this.$refs.scroller;
                    if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
                });
            },

            // ---------- Theme, toasts, confirm ----------
            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = this.theme;
                document.querySelector('meta[name="theme-color"]').content = this.theme === 'dark' ? '#070b14' : '#f3f5f9';
                store.set('chatdocs-theme', this.theme);
            },
            toast(text, kind = 'info') {
                const id = nextId();
                this.toasts.push({ id, text, kind });
                setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 3800);
            },
            confirm(title, body, action) {
                return new Promise((resolve) => {
                    this.confirmState = { title, body, action, resolve };
                    this.$nextTick(() => this.$refs.confirmBtn?.focus());
                });
            },
            resolveConfirm(value) {
                if (!this.confirmState) return;
                this.confirmState.resolve(value);
                this.confirmState = null;
            },
        },
    });

    app.component('icon', {
        template: '#icon-tpl',
        props: { name: { type: String, required: true } },
        data() { return { paths: ICONS }; },
    });

    app.mount('#app');
</script>
</body>
</html>
